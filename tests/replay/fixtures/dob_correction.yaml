name: dob_correction
scenario: default
turns:
  - user: "Margaret Chen, DOB 1985-03-15, last four 4472, about my denied healthcare claim from January."
    analysis:
      identity: {full_name: "Margaret Chen", dob: "1985-03-15", id_last4: "4472"}
      case_hints: {case_type: healthcare, status: denied, month: 1}
      intent: denial_question
    expect: {phase: PROCESS_CASE, verified: true, guard_ok: true}
  - user: "Actually my date of birth is 1985-03-16."
    analysis:
      corrections: [{slot: dob, new_value: "1985-03-16"}]
    expect:
      phase: PROCESS_CASE
      verified: true
      attempts: 0
      pending_ask: identity_confirm
      reply_contains: ["Margaret Chen"]
      reply_not_contains: ["CL-2048", "pathology", "1985-03-16", "1985-03-15", "I need to correct",
                           "shouldn't have", "apolog"]
      guard_ok: true
  - user: "Sorry, I meant 1985-03-15. Yes, it's me."
    analysis:
      requests: {confirmation: "yes"}
      corrections: [{slot: dob, new_value: "1985-03-15"}]
    expect:
      phase: PROCESS_CASE
      verified: true
      attempts: 0
      reply_not_contains: ["1985-03-15", "Is this still"]
      guard_ok: true
