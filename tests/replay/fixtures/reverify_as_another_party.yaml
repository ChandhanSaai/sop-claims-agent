name: reverify_as_another_party
scenario: default
today: "2026-10-07"
turns:
  - user: "I'm Margaret Chen, DOB 1985-03-15, SSN last four 4472. Why was my healthcare claim from January denied?"
    analysis:
      identity: {full_name: "Margaret Chen", dob: "1985-03-15", id_last4: "4472"}
      caller_role: policyholder
      case_hints: {case_type: healthcare, status: denied, month: 1}
      intent: denial_question
    expect:
      phase: PROCESS_CASE
      verified: true
      party_id: P9
      reply_contains: ["CL-2048", "pathology report"]
      reply_not_contains: ["1985-03-15", "4472"]
      guard_ok: true
  - user: "Sorry, this is actually Ma Tian, born 1964-09-10, last four 6688."
    analysis:
      corrections:
        - {slot: full_name, new_value: "Ma Tian"}
        - {slot: dob, new_value: "1964-09-10"}
        - {slot: id_last4, new_value: "6688"}
    expect:
      phase: PROCESS_CASE
      verified: true
      party_id: P12
      reply_contains: ["CL-3001"]
      reply_not_contains: ["CL-2048", "pathology", "Margaret", "1964-09-10", "6688", "I don't see a claim"]
      guard_ok: true
  - user: "That's all."
    analysis:
      requests: {closing: true}
    expect:
      phase: POST_PROCESS
      pending_ask: email_offer
      reply_not_contains: ["CL-2048", "pathology", "Margaret", "margaret@email.com", "matian@example.com"]
      guard_ok: true
  - user: "Yes please."
    analysis:
      requests: {confirmation: "yes", email_summary: "yes"}
    expect:
      phase: POST_PROCESS
      pending_ask: email_confirm
      reply_contains: ["CL-3001"]
      reply_not_contains: ["CL-2048", "pathology", "Margaret", "1964-09-10", "6688"]
      guard_ok: true
  - user: "Yes, send it."
    analysis:
      requests: {confirmation: "yes"}
    expect:
      phase: POST_PROCESS
      pending_ask: none
      outbox_len: 1
      reply_contains: ["EML-"]
      reply_not_contains: ["CL-2048", "Margaret"]
      guard_ok: true
